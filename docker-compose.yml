services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.12
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    depends_on:
      - prometheus
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:1.14.1
    user: "0:0"
    volumes:
      - pyroscope_data:/data
    ports:
      - "4040:4040"
    restart: unless-stopped

  payment:
    build: .
    image: observability-demo-api:local
    environment:
      OTEL_SERVICE_NAME: payment
      DEPLOYMENT_ENVIRONMENT: demo
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      - loki
      - tempo
      - pyroscope
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  checkout:
    build: .
    image: observability-demo-api:local
    environment:
      OTEL_SERVICE_NAME: checkout
      DEPLOYMENT_ENVIRONMENT: demo
      PAYMENT_URL: http://payment:8000/payment
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
    ports:
      - "8080:8000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  load-generator:
    build: .
    image: observability-demo-api:local
    command: ["python", "loadgen.py"]
    environment:
      CHECKOUT_URL: http://checkout:8000/checkout
      LOADGEN_SCENARIO: fast
    depends_on:
      checkout:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  pyroscope_data:
  grafana_data:
